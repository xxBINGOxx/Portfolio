<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0A0A0B"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(242, 240, 234, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)"/>
  
  <!-- Flow Lines -->
  <path d="M 180 225 L 290 225" stroke="#C8F53C" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 430 225 L 530 225" stroke="#86B6C4" stroke-width="2"/>
  <path d="M 670 225 L 720 225" stroke="#C8F53C" stroke-width="2"/>

  <!-- Node 1: Inbound Webhook -->
  <g transform="translate(40, 185)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="#C8F53C" stroke-width="1.5"/>
    <text x="70" y="32" fill="#86B6C4" font-family="monospace" font-size="10" text-anchor="middle">WEBHOOK LISTENER</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Form Submission</text>
    <circle cx="140" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Node 2: CRM Enrichment -->
  <g transform="translate(290, 185)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="rgba(242, 240, 234, 0.2)" stroke-width="1.5"/>
    <text x="70" y="32" fill="#9A9A94" font-family="monospace" font-size="10" text-anchor="middle">CRM SYNC</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Upsert Lead</text>
    <circle cx="0" cy="40" r="5" fill="#C8F53C"/>
    <circle cx="140" cy="40" r="5" fill="#86B6C4"/>
  </g>

  <!-- Node 3: Email Dispatcher -->
  <g transform="translate(530, 185)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="#C8F53C" stroke-width="1.5"/>
    <text x="70" y="32" fill="#C8F53C" font-family="monospace" font-size="10" text-anchor="middle">INSTANT REPLY</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Send Template</text>
    <circle cx="0" cy="40" r="5" fill="#86B6C4"/>
    <circle cx="140" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Top bar info -->
  <text x="50" y="50" fill="#C8F53C" font-family="monospace" font-size="11" letter-spacing="1">FLOW 02 // INSTANT LEAD FOLLOW-UP</text>
  <text x="750" y="50" fill="#9A9A94" font-family="monospace" font-size="11" text-anchor="end">SPEED: &lt; 10s · SECURE PAYLOAD</text>
</svg>
