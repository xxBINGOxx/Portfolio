<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0A0A0B"/>
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(242, 240, 234, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid3)"/>
  
  <!-- Flow Lines -->
  <path d="M 180 225 L 280 225" stroke="#C8F53C" stroke-width="2"/>
  <path d="M 440 225 L 530 160" stroke="#C8F53C" stroke-width="2"/>
  <path d="M 440 225 L 530 290" stroke="#86B6C4" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 680 160 L 730 160" stroke="#C8F53C" stroke-width="2"/>
  <path d="M 680 290 L 730 290" stroke="#86B6C4" stroke-width="2"/>

  <!-- Node 1: Payment Gateway Webhook -->
  <g transform="translate(40, 185)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="#C8F53C" stroke-width="1.5"/>
    <text x="70" y="32" fill="#86B6C4" font-family="monospace" font-size="10" text-anchor="middle">INBOUND GATEWAY</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PayMob / Stripe</text>
    <circle cx="140" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Node 2: HMAC Verification -->
  <g transform="translate(280, 185)">
    <rect width="160" height="80" rx="8" fill="#131316" stroke="#C8F53C" stroke-width="2"/>
    <text x="80" y="30" fill="#C8F53C" font-family="monospace" font-size="10" text-anchor="middle">HMAC SHA256</text>
    <text x="80" y="50" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Verify Signature</text>
    <circle cx="0" cy="40" r="5" fill="#C8F53C"/>
    <circle cx="160" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Node 3: Success Fulfillment -->
  <g transform="translate(530, 120)">
    <rect width="150" height="80" rx="8" fill="#131316" stroke="rgba(242, 240, 234, 0.2)" stroke-width="1.5"/>
    <text x="75" y="32" fill="#C8F53C" font-family="monospace" font-size="10" text-anchor="middle">VALIDATED: TRUE</text>
    <text x="75" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Fulfill Order &amp; DB</text>
    <circle cx="0" cy="40" r="5" fill="#C8F53C"/>
    <circle cx="150" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Node 4: Exponential Retry & Alert -->
  <g transform="translate(530, 250)">
    <rect width="150" height="80" rx="8" fill="#131316" stroke="#86B6C4" stroke-width="1.5"/>
    <text x="75" y="32" fill="#86B6C4" font-family="monospace" font-size="10" text-anchor="middle">ANOMALY / RETRY</text>
    <text x="75" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Escalate to Dev</text>
    <circle cx="0" cy="40" r="5" fill="#86B6C4"/>
    <circle cx="150" cy="40" r="5" fill="#86B6C4"/>
  </g>

  <!-- Top bar info -->
  <text x="50" y="50" fill="#C8F53C" font-family="monospace" font-size="11" letter-spacing="1">FLOW 03 // SECURE PAYMENT WEBHOOK HANDLER</text>
  <text x="750" y="50" fill="#9A9A94" font-family="monospace" font-size="11" text-anchor="end">SECURITY: CRYPTOGRAPHIC VERIFICATION</text>
</svg>
