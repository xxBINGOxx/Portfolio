<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0A0A0B"/>
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(242, 240, 234, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8F53C"/>
      <stop offset="100%" stop-color="#86B6C4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid1)"/>
  
  <!-- Flow Lines -->
  <path d="M 170 225 L 290 225" stroke="#C8F53C" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 430 225 L 530 160" stroke="rgba(242, 240, 234, 0.25)" stroke-width="2"/>
  <path d="M 430 225 L 530 290" stroke="rgba(242, 240, 234, 0.25)" stroke-width="2"/>
  <path d="M 670 160 L 710 160" stroke="#86B6C4" stroke-width="2"/>
  <path d="M 670 290 L 710 290" stroke="#C8F53C" stroke-width="2"/>

  <!-- Node 1: Webhook Trigger -->
  <g transform="translate(50, 185)">
    <rect width="120" height="80" rx="8" fill="#131316" stroke="#C8F53C" stroke-width="1.5"/>
    <text x="60" y="32" fill="#86B6C4" font-family="monospace" font-size="10" text-anchor="middle">TRIGGER</text>
    <text x="60" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Shopify Order</text>
    <circle cx="120" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Node 2: Payload Validation & Transform -->
  <g transform="translate(290, 185)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="rgba(242, 240, 234, 0.2)" stroke-width="1.5"/>
    <text x="70" y="32" fill="#9A9A94" font-family="monospace" font-size="10" text-anchor="middle">SECURE VALIDATE</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Verify &amp; Sanitize</text>
    <circle cx="0" cy="40" r="5" fill="#C8F53C"/>
    <circle cx="140" cy="40" r="5" fill="#86B6C4"/>
  </g>

  <!-- Node 3: Google Sheets Sync -->
  <g transform="translate(530, 120)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="rgba(242, 240, 234, 0.2)" stroke-width="1.5"/>
    <text x="70" y="32" fill="#9A9A94" font-family="monospace" font-size="10" text-anchor="middle">DATABASE / SHEETS</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Append Row</text>
    <circle cx="0" cy="40" r="5" fill="#86B6C4"/>
    <circle cx="140" cy="40" r="5" fill="#86B6C4"/>
  </g>

  <!-- Node 4: Telegram / Slack Alert -->
  <g transform="translate(530, 250)">
    <rect width="140" height="80" rx="8" fill="#131316" stroke="rgba(242, 240, 234, 0.2)" stroke-width="1.5"/>
    <text x="70" y="32" fill="#C8F53C" font-family="monospace" font-size="10" text-anchor="middle">DISPATCH</text>
    <text x="70" y="52" fill="#F2F0EA" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Telegram Alert</text>
    <circle cx="0" cy="40" r="5" fill="#C8F53C"/>
    <circle cx="140" cy="40" r="5" fill="#C8F53C"/>
  </g>

  <!-- Top bar info -->
  <text x="50" y="50" fill="#C8F53C" font-family="monospace" font-size="11" letter-spacing="1">FLOW 01 // ORDER-TO-CRM SYNC</text>
  <text x="750" y="50" fill="#9A9A94" font-family="monospace" font-size="11" text-anchor="end">STATUS: ACTIVE · n8n v1.x</text>
</svg>
